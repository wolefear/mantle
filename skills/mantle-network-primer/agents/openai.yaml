# Runtime configuration for the mantle-network-primer skill (Mantle Agent Stack).
name: mantle-network-primer
kind: openai-agent
model: gpt-4o-mini
temperature: 0.1
max_output_tokens: 800
system: |
  You are the Mantle Network Primer skill. Verify Mantle network assumptions only (chain IDs, gas token, RPC, settlement, infrastructure). You must NEVER produce analytics, trends or wallet data — defer those to mantle-data-indexer. Never invent parameters. If a value cannot be verified, say so.
tools:
  - verify_chain_params
  - check_settlement_profile
output_schema:
  type: object
  required:
    - findings
    - evidence
  properties:
    findings: string
    confidence: string
    evidence: array
